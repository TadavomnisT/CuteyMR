<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five-step story diagram: books, torn piles, tally sheets, baskets, final report" font-family="ui-monospace,Menlo,Consolas,monospace">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#9aa4b2"/>
      </marker>
    </defs>
    <rect x="0" y="0" width="960" height="470" fill="#161b22"/>
    <!-- step labels -->
    <g font-size="12" fill="#9aa4b2" font-weight="700">
      <text x="30" y="46">STEP 1 · SPLIT</text>
      <text x="218" y="46">STEP 2 · MAP (count locally)</text>
      <text x="470" y="46">STEP 3 · SHUFFLE (word → basket)</text>
      <text x="736" y="46">STEP 4 · REDUCE (add each basket)</text>
    </g>
    <!-- books -->
    <g>
      <rect x="30" y="70" width="54" height="70" rx="4" fill="#233042" stroke="#c084fc"/>
      <rect x="42" y="82" width="30" height="6" rx="2" fill="#0d1117"/>
      <rect x="42" y="94" width="30" height="6" rx="2" fill="#0d1117"/>
      <rect x="42" y="106" width="20" height="6" rx="2" fill="#0d1117"/>
      <rect x="88" y="84" width="50" height="56" rx="4" fill="#2b2340" stroke="#e879f9"/>
      <rect x="99" y="96" width="28" height="6" rx="2" fill="#0d1117"/>
      <rect x="99" y="108" width="28" height="6" rx="2" fill="#0d1117"/>
      <rect x="92" y="66" width="50" height="56" rx="4" fill="#233042" stroke="#c084fc"/>
    </g>
    <text x="60" y="170" font-size="12" fill="#9aa4b2">10,000 books</text>
    <path d="M150 112 H205" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arr)"/>
    <!-- piles -->
    <g>
      <rect x="218" y="70" width="70" height="52" rx="4" fill="#1c2129" stroke="#57d99a"/>
      <line x1="218" y1="96" x2="288" y2="96" stroke="#30363d"/>
      <rect x="232" y="134" width="70" height="52" rx="4" fill="#1c2129" stroke="#57d99a"/>
      <line x1="232" y1="160" x2="302" y2="160" stroke="#30363d"/>
      <rect x="246" y="198" width="70" height="52" rx="4" fill="#1c2129" stroke="#57d99a"/>
      <line x1="246" y1="224" x2="316" y2="224" stroke="#30363d"/>
    </g>
    <text x="238" y="272" font-size="12" fill="#9aa4b2">many small piles</text>
    <path d="M330 96 H395" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arr)"/>
    <!-- tally sheets -->
    <g font-size="12" fill="#c9d6e3">
      <rect x="410" y="70" width="130" height="64" rx="6" fill="#1c2129" stroke="#57d99a"/>
      <text x="422" y="92">whale&#160;&#160;|||</text>
      <text x="422" y="108">sea&#160;&#160;&#160;&#160;||</text>
      <text x="422" y="124">the&#160;&#160;&#160;||||||</text>
      <rect x="410" y="150" width="130" height="64" rx="6" fill="#1c2129" stroke="#57d99a"/>
      <text x="422" y="172">whale&#160;&#160;||</text>
      <text x="422" y="188">ship&#160;&#160;&#160;|</text>
      <text x="422" y="204">the&#160;&#160;&#160;||||</text>
      <rect x="410" y="230" width="130" height="64" rx="6" fill="#1c2129" stroke="#57d99a"/>
      <text x="422" y="252">whale&#160;&#160;|||</text>
      <text x="422" y="268">star&#160;&#160;&#160;|</text>
      <text x="422" y="284">the&#160;&#160;&#160;|||||</text>
    </g>
    <text x="415" y="316" font-size="12" fill="#9aa4b2">each friend: local tallies only</text>
    <!-- arrows to baskets -->
    <path d="M548 102 C580 102 590 150 620 158" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M548 182 C580 182 590 185 618 185" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M548 262 C580 262 590 215 620 208" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <!-- baskets -->
    <g>
      <path d="M622 140 L640 140 L636 230 L626 230 Z" fill="#233042" stroke="#c084fc"/>
      <path d="M660 140 L678 140 L674 230 L664 230 Z" fill="#2b2340" stroke="#e879f9"/>
      <path d="M698 140 L716 140 L712 230 L702 230 Z" fill="#33291a" stroke="#f3b35b"/>
      <text x="631" y="133" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="700">A</text>
      <text x="669" y="133" font-size="12" fill="#e879f9" text-anchor="middle" font-weight="700">B</text>
      <text x="707" y="133" font-size="12" fill="#f3b35b" text-anchor="middle" font-weight="700">C</text>
      <text x="622" y="250" font-size="11" fill="#9aa4b2">whale ||| ||| ||</text>
      <text x="622" y="266" font-size="11" fill="#9aa4b2">sea || · star |</text>
      <text x="622" y="282" font-size="11" fill="#9aa4b2">the |||||| |||| |||||</text>
    </g>
    <path d="M740 185 H782" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arr)"/>
    <!-- reduce results -->
    <g font-size="13" fill="#c9d6e3">
      <rect x="790" y="70" width="150" height="86" rx="6" fill="#1c2129" stroke="#c084fc"/>
      <text x="802" y="94" fill="#c084fc" font-weight="700">ADDER A</text>
      <text x="802" y="114">whale = 8</text>
      <text x="802" y="132">sea = 2 · star = 1</text>
      <rect x="790" y="170" width="150" height="86" rx="6" fill="#1c2129" stroke="#e879f9"/>
      <text x="802" y="194" fill="#e879f9" font-weight="700">ADDER B</text>
      <text x="802" y="214">the = 15</text>
      <text x="802" y="232">ship = 1</text>
      <rect x="790" y="270" width="150" height="86" rx="6" fill="#1c2129" stroke="#f3b35b"/>
      <text x="802" y="294" fill="#f3b35b" font-weight="700">ADDER C</text>
      <text x="802" y="314">(empty is fine)</text>
    </g>
    <!-- final report -->
    <path d="M870 356 V392" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="622" y="396" width="318" height="54" rx="8" fill="rgba(87,217,154,.09)" stroke="#57d99a"/>
      <text x="640" y="419" font-size="14" fill="#57d99a" font-weight="700">FINAL REPORT — master staples them together</text>
      <text x="640" y="438" font-size="12.5" fill="#c9d6e3">the 15 · whale 8 · sea 2 · star 1 · ship 1</text>
    </g>
    <g>
      <rect x="30" y="396" width="560" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="419" font-size="13" fill="#9aa4b2">notice: nobody ever needed to see the whole library. every friend only ever</text>
      <text x="46" y="438" font-size="13" fill="#9aa4b2">held piles, tallies or one basket — and yet the total is exact.</text>
    </g>
  </svg>
